name: build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  common-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run checks and generate verification metadata
        run: ./gradlew --write-verification-metadata sha256 check
      - name: Show dependency verification metadata changes
        if: always()
        run: git diff -- gradle/verification-metadata.xml

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android and generate verification metadata
        run: ./gradlew --write-verification-metadata sha256 :apps:androidApp:assembleDebug
      - name: Show dependency verification metadata changes
        if: always()
        run: git diff -- gradle/verification-metadata.xml

  desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Windows MSI and generate verification metadata
        run: ./gradlew.bat --write-verification-metadata sha256 :apps:desktopApp:packageReleaseMsi
      - name: Show dependency verification metadata changes
        if: always()
        run: git diff -- gradle/verification-metadata.xml
      - name: Upload Windows installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Worldloom-Windows-0.1.0-alpha.1
          path: apps/desktopApp/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate iOS dependency verification metadata
        run: ./gradlew --write-verification-metadata sha256 :shared:ui-game:compileKotlinIosSimulatorArm64
      - name: Show dependency verification metadata changes
        if: always()
        run: git diff -- gradle/verification-metadata.xml
      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -project apps/iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath build/ios-derived
          CODE_SIGNING_ALLOWED=NO
          build
