name: build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  common-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :apps:androidApp:assembleDebug

  desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Windows MSI
        run: ./gradlew.bat :apps:desktopApp:packageReleaseMsi
      - name: Smoke-test installed Windows runtime
        shell: pwsh
        run: |
          $msiFiles = @(Get-ChildItem "apps/desktopApp/build/compose/binaries/main-release/msi" -Filter "*.msi")
          if ($msiFiles.Count -ne 1) {
            throw "Expected one MSI, found $($msiFiles.Count)"
          }

          $installer = Start-Process msiexec.exe `
            -ArgumentList @("/i", "`"$($msiFiles[0].FullName)`"", "/qn", "/norestart") `
            -Wait `
            -PassThru
          if ($installer.ExitCode -ne 0) {
            throw "MSI installation failed with exit code $($installer.ExitCode)"
          }

          $installDirectory = Join-Path $env:ProgramFiles "Worldloom"
          $runtimeImage = Join-Path $installDirectory "runtime/lib/modules"
          $executable = Join-Path $installDirectory "Worldloom.exe"
          if (-not (Test-Path $runtimeImage)) {
            throw "Bundled runtime image was not installed at $runtimeImage"
          }
          if (-not (Test-Path $executable)) {
            throw "Application launcher was not installed at $executable"
          }

          $imageEntries = @(& "$env:JAVA_HOME/bin/jimage.exe" list $runtimeImage)
          if ($LASTEXITCODE -ne 0 -or -not ($imageEntries | Where-Object { $_.Trim() -eq "Module: java.sql" })) {
            throw "Bundled Java runtime does not contain java.sql"
          }

          # jpackage removes the generic java launcher from the runtime image. Copy the
          # launcher from the same JDK build so the installed modules and libraries can
          # execute the main class directly and expose startup exceptions to CI.
          $runtimeJava = Join-Path $installDirectory "runtime/bin/java.exe"
          Copy-Item "$env:JAVA_HOME/bin/java.exe" $runtimeJava
          $jars = @(Get-ChildItem (Join-Path $installDirectory "app") -Filter "*.jar")
          if ($jars.Count -eq 0) {
            throw "No application JARs were installed"
          }

          $env:CLASSPATH = ($jars.FullName -join ";")
          $resources = Join-Path $installDirectory "app/resources"
          if (-not (Test-Path (Join-Path $resources "skiko-windows-x64.dll.sha256"))) {
            throw "Packaged Skiko resources were not installed at $resources"
          }
          $env:JDK_JAVA_OPTIONS = "-Dcompose.application.resources.dir=`"$resources`""
          $stdout = Join-Path $env:RUNNER_TEMP "worldloom-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "worldloom-stderr.log"
          $mainClass = Start-Process $runtimeJava `
            -ArgumentList "io.worldloom.app.desktop.MainKt" `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          Start-Sleep -Seconds 10
          if ($mainClass.HasExited) {
            $output = (Get-Content $stdout, $stderr -ErrorAction SilentlyContinue) -join [Environment]::NewLine
            throw "Installed runtime exited during startup with code $($mainClass.ExitCode):`n$output"
          }
          Stop-Process -Id $mainClass.Id -Force
          Remove-Item Env:JDK_JAVA_OPTIONS

          $app = Start-Process $executable -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) {
            throw "Installed native launcher exited during startup with code $($app.ExitCode)"
          }
          Stop-Process -Id $app.Id -Force
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Worldloom-Windows-0.1.1-alpha.1
          path: apps/desktopApp/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -project apps/iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath build/ios-derived
          CODE_SIGNING_ALLOWED=NO
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          build
