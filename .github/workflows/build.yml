name: build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  common-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable Android APK
        run: ./gradlew :apps:androidApp:assembleDebug
      - name: Stage Android package
        shell: bash
        run: |
          mkdir -p dist
          apk="$(find apps/androidApp/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          safe_ref="${GITHUB_REF_NAME//\//-}"
          cp "$apk" "dist/Worldloom-Android-${safe_ref}.apk"
      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: worldloom-android-${{ github.run_id }}
          path: dist/*.apk
          if-no-files-found: error

  desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Windows MSI
        run: ./gradlew.bat :apps:desktopApp:packageReleaseMsi
      - name: Smoke-test installed Windows runtime
        shell: pwsh
        run: |
          $msiFiles = @(Get-ChildItem "apps/desktopApp/build/compose/binaries/main-release/msi" -Filter "*.msi")
          if ($msiFiles.Count -ne 1) {
            throw "Expected one MSI, found $($msiFiles.Count)"
          }

          $installer = Start-Process msiexec.exe `
            -ArgumentList @("/i", "`"$($msiFiles[0].FullName)`"", "/qn", "/norestart") `
            -Wait `
            -PassThru
          if ($installer.ExitCode -ne 0) {
            throw "MSI installation failed with exit code $($installer.ExitCode)"
          }

          $installDirectory = Join-Path $env:ProgramFiles "Worldloom"
          $runtimeImage = Join-Path $installDirectory "runtime/lib/modules"
          $executable = Join-Path $installDirectory "Worldloom.exe"
          if (-not (Test-Path $runtimeImage)) {
            throw "Bundled runtime image was not installed at $runtimeImage"
          }
          if (-not (Test-Path $executable)) {
            throw "Application launcher was not installed at $executable"
          }

          $desktopShortcut = @(
            (Join-Path $env:PUBLIC "Desktop/Worldloom.lnk"),
            (Join-Path $env:USERPROFILE "Desktop/Worldloom.lnk")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $desktopShortcut) {
            throw "Worldloom desktop shortcut was not installed"
          }

          $startMenuShortcut = @(
            (Join-Path $env:ProgramData "Microsoft/Windows/Start Menu/Programs/Worldloom/Worldloom.lnk"),
            (Join-Path $env:APPDATA "Microsoft/Windows/Start Menu/Programs/Worldloom/Worldloom.lnk")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $startMenuShortcut) {
            throw "Worldloom Start menu shortcut was not installed"
          }

          $shell = New-Object -ComObject WScript.Shell
          foreach ($shortcutPath in @($desktopShortcut, $startMenuShortcut)) {
            $shortcut = $shell.CreateShortcut($shortcutPath)
            if ($shortcut.TargetPath -ne $executable) {
              throw "Shortcut $shortcutPath targets '$($shortcut.TargetPath)' instead of $executable"
            }
          }

          $imageEntries = @(& "$env:JAVA_HOME/bin/jimage.exe" list $runtimeImage)
          if ($LASTEXITCODE -ne 0 -or -not ($imageEntries | Where-Object { $_.Trim() -eq "Module: java.sql" })) {
            throw "Bundled Java runtime does not contain java.sql"
          }

          # jpackage removes the generic java launcher from the runtime image. Copy the
          # launcher from the same JDK build so the installed modules and libraries can
          # execute the main class directly and expose startup exceptions to CI.
          $runtimeJava = Join-Path $installDirectory "runtime/bin/java.exe"
          Copy-Item "$env:JAVA_HOME/bin/java.exe" $runtimeJava
          $jars = @(Get-ChildItem (Join-Path $installDirectory "app") -Filter "*.jar")
          if ($jars.Count -eq 0) {
            throw "No application JARs were installed"
          }

          $env:CLASSPATH = ($jars.FullName -join ";")
          $skikoHashes = @(Get-ChildItem $installDirectory -Filter "skiko-windows-x64.dll.sha256" -Recurse)
          if ($skikoHashes.Count -ne 1) {
            throw "Expected one packaged Skiko resource, found $($skikoHashes.Count)"
          }
          $resources = $skikoHashes[0].Directory.FullName
          $env:JDK_JAVA_OPTIONS = "-Dcompose.application.resources.dir=`"$resources`" -Dskiko.library.path=`"$resources`""
          $stdout = Join-Path $env:RUNNER_TEMP "worldloom-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "worldloom-stderr.log"
          $mainClass = Start-Process $runtimeJava `
            -ArgumentList "io.worldloom.app.desktop.MainKt" `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          Start-Sleep -Seconds 10
          if ($mainClass.HasExited) {
            $output = (Get-Content $stdout, $stderr -ErrorAction SilentlyContinue) -join [Environment]::NewLine
            throw "Installed runtime exited during startup with code $($mainClass.ExitCode):`n$output"
          }
          Stop-Process -Id $mainClass.Id -Force
          Remove-Item Env:JDK_JAVA_OPTIONS

          $app = Start-Process $startMenuShortcut -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) {
            throw "Installed native launcher exited during startup with code $($app.ExitCode)"
          }
          Stop-Process -Id $app.Id -Force
      - name: Stage Windows installer
        shell: pwsh
        run: |
          $msiFiles = @(Get-ChildItem "apps/desktopApp/build/compose/binaries/main-release/msi" -Filter "*.msi")
          if ($msiFiles.Count -ne 1) {
            throw "Expected one MSI, found $($msiFiles.Count)"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $safeRef = $env:GITHUB_REF_NAME -replace '[/\\]', '-'
          Copy-Item $msiFiles[0].FullName "dist/Worldloom-Windows-x64-$safeRef.msi"
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: worldloom-windows-${{ github.run_id }}
          path: dist/*.msi
          if-no-files-found: error

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -project apps/iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath build/ios-derived
          CODE_SIGNING_ALLOWED=NO
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - common-check
      - android-build
      - desktop-build
      - ios-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: worldloom-*-${{ github.run_id }}
          path: dist
          merge-multiple: true
      - name: Write SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "Worldloom ${GITHUB_REF_NAME#v}"
          --generate-notes
          --verify-tag
