name: build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  common-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate dependency verification metadata
        run: ./gradlew --write-verification-metadata sha256 help
      - name: Show dependency verification metadata changes
        run: git diff -- gradle/verification-metadata.xml
      - run: ./gradlew check

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --write-verification-metadata sha256 help
      - run: ./gradlew :apps:androidApp:assembleDebug

  desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew.bat --write-verification-metadata sha256 help
      - run: ./gradlew.bat :apps:desktopApp:classes

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --write-verification-metadata sha256 help
      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -project apps/iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath build/ios-derived
          CODE_SIGNING_ALLOWED=NO
          build
